name: Collection and extraction checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install extraction support
        run: python -m pip install -e '.[extraction_spacing]'
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Smoke-check collection inventory
        run: PYTHONPATH=src python -m mars_rag inventory
      - name: Test extraction with synthetic PDFs
        run: PYTHONPATH=src python -m unittest discover -s tests -v
